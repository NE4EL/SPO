services:

  # ─── База данных ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sto_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-sto_db}
      POSTGRES_USER:     ${DB_USER:-sto_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data   # постоянное хранение данных БД
    networks:
      - sto_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sto_user} -d ${DB_NAME:-sto_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Бэкенд (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sto_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # ждём пока PostgreSQL не станет готов
    environment:
      DATABASE_URL:                  postgresql://${DB_USER:-sto_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-sto_db}
      SECRET_KEY:                    ${SECRET_KEY}
      ALGORITHM:                     HS256
      ACCESS_TOKEN_EXPIRE_MINUTES:   ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS:     ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ADMIN_USERNAME:                ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD:                ${ADMIN_PASSWORD}
      ADMIN_EMAIL:                   ${ADMIN_EMAIL:-admin@sto.ru}
      ANTHROPIC_API_KEY:             ${ANTHROPIC_API_KEY:-}
    volumes:
      - model_weights:/app/app/ml/weights   # веса нейросети сохраняются между перезапусками
    networks:
      - sto_network
    expose:
      - "8000"                       # порт доступен только внутри сети (через nginx)

  # ─── Фронтенд (React → Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sto_frontend
    restart: unless-stopped
    ports:
      - "80:80"                      # единственная точка входа для браузера
    depends_on:
      - backend
    networks:
      - sto_network

# ─── Сети ────────────────────────────────────────────────────────────────────
networks:
  sto_network:
    driver: bridge                   # изолированная внутренняя сеть контейнеров

# ─── Тома ────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:                     # данные PostgreSQL (не удаляются при остановке)
  model_weights:                     # веса ML-модели (model.pkl + scaler.pkl)
